name: update tech stack from real repos

on:
    schedule:
        - cron: '0 1 * * *' # setiap hari jam 1 pagi UTC
    workflow_dispatch: # supaya bisa dijalankan manual

jobs:
    update:
        permissions:
            contents: write
        runs-on: ubuntu-latest
        steps:
            - name: checkout repo
              uses: actions/checkout@v4

            - name: setup python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - name: run tech stack updater
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: python update_tech_stack.py

            - name: commit changes if any
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"
                  git add README.md
                  git diff --cached --quiet || git commit -m "chore: update tech stack from real GitHub activity"
                  git push
